<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: dark navy rounded square -->
  <rect width="100" height="100" rx="14" fill="#1d2330"/>

  <!-- Intertwining S (gold) and T (cream) monogram -->
  <!-- S weaves: in front of T's left crossbar, behind T's right crossbar + stem -->

  <!-- Layer 1: T left crossbar — drawn first, sits behind S -->
  <rect x="18" y="39" width="28" height="10" fill="#fcf7ef"/>

  <!-- Layer 2: S path in gold — covers left crossbar (S appears in front on left) -->
  <path d="M 62,22 C 62,12 20,12 20,32 C 20,50 72,52 72,62 C 72,76 22,80 22,72"
        fill="none" stroke="#d48f1f" stroke-width="9" stroke-linecap="round"/>

  <!-- Layer 3: T right crossbar — drawn over S (T appears in front on right) -->
  <rect x="46" y="39" width="34" height="10" fill="#fcf7ef"/>

  <!-- Layer 4: T stem — drawn last, appears in front of S's lower arc where they cross -->
  <rect x="43" y="39" width="10" height="42" fill="#fcf7ef"/>
</svg>
