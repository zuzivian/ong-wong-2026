name: Deploy SpacetimeDB Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'spacetimedb/**'
      - 'shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SpacetimeDB CLI
        run: |
          curl -fL "https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.4.0/spacetime-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/spacetime.tar.gz
          tar -xzf /tmp/spacetime.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv /tmp/spacetimedb-cli "$HOME/.local/bin/spacetime"
          chmod +x "$HOME/.local/bin/spacetime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install module dependencies
        run: npm install
        working-directory: spacetimedb

      - name: Publish module to maincloud
        run: |
          mkdir -p "$HOME/.config/spacetime"
          cat > "$HOME/.config/spacetime/cli.toml" <<EOF
          default_server = "maincloud"
          spacetimedb_token = "$SPACETIME_TOKEN"

          [[server_configs]]
          nickname = "maincloud"
          host = "maincloud.spacetimedb.com"
          protocol = "https"
          EOF
          spacetime publish --server maincloud --module-path spacetimedb -y
        env:
          SPACETIME_TOKEN: ${{ secrets.SPACETIME_TOKEN }}
