name: Deploy SpacetimeDB Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'spacetimedb/**'
      - 'shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SpacetimeDB CLI
        run: |
          curl -fL "https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.4.0/spacetime-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/spacetime.tar.gz
          tar -xzf /tmp/spacetime.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv /tmp/spacetimedb-cli "$HOME/.local/bin/spacetime"
          chmod +x "$HOME/.local/bin/spacetime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install module dependencies
        run: npm install
        working-directory: spacetimedb

      - name: Debug token format
        run: |
          echo "Token length: ${#SPACETIME_TOKEN}"
          echo "Token prefix (first 10 chars): ${SPACETIME_TOKEN:0:10}"
          echo "Token suffix (last 10 chars): ${SPACETIME_TOKEN: -10}"
          echo "Dot count: $(echo "$SPACETIME_TOKEN" | tr -cd '.' | wc -c)"
        env:
          SPACETIME_TOKEN: ${{ secrets.SPACETIME_TOKEN }}

      - name: Publish module to maincloud
        run: |
          mkdir -p "$HOME/.config/spacetime"
          printf 'default_server = "maincloud"\nspacetimedb_token = "%s"\n\n[[server_configs]]\nnickname = "maincloud"\nhost = "maincloud.spacetimedb.com"\nprotocol = "https"\n' "$SPACETIME_TOKEN" > "$HOME/.config/spacetime/cli.toml"
          echo "--- cli.toml (token redacted) ---"
          sed 's/spacetimedb_token = ".*"/spacetimedb_token = "<redacted>"/' "$HOME/.config/spacetime/cli.toml"
          spacetime publish --server maincloud --module-path spacetimedb -y
        env:
          SPACETIME_TOKEN: ${{ secrets.SPACETIME_TOKEN }}
